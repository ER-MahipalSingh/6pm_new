<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1::before {
        content: "Hey ";
        color: aqua;
      }

      h1::after {
        content: " Students";
        color: brown;
      }

      button {
        padding: 4px 35px;
        background: brown;
        color: white;
        font-size: 23px;
        border-radius: 5px;
      }

      button:hover {
        background-color: rgba(165, 42, 42, 0.465);
        color: aqua;
        transform: scale(1.3);
        /* transform: rotate(180deg); */
        /* transform: skew(220deg); */
        /* transform: scale(1.5); */
        transform: translateY(300px);
    }
    
    .main {
        width: 300px;
        height: 300px;
        border: 1px solid brown;
        transition: all 3s ease-in;
      }
    </style>
  </head>
  <body>
    <h1>Hello</h1>

    <button>Login</button>

    <div class="main"></div>
  </body>
</html>
