<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }

      .box {
        width: 500px;
        height: 300px;
        border: 1px solid red;
        /* padding: 20px 30px; */
        padding-inline: 30px;
        margin: 10px 14px 18px 22px;
        border-radius: 10px 50px;
      }

      h1{
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Hello</h1>
    </div>
  </body>
</html>
